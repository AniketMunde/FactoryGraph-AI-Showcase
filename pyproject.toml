[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factorygraph-ai"
version = "0.1.0"
description = "Causal industrial failure prediction and reproducible research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "pyarrow>=18,<27",
  "scikit-learn>=1.5,<2", "lightgbm>=4.5,<5", "pydantic>=2.10,<3",
  "PyYAML>=6,<7", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
factorygraph = "factorygraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
