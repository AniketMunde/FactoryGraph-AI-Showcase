<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc"><title id="title">Research workflow</title><desc id="desc">Original explanatory diagram of existing research stages, not benchmark evidence.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#31768a"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="55" y="58" fill="#102334" font-family="Arial,sans-serif" font-size="34" font-weight="700"><tspan x="55" dy="0">Research workflow</tspan></text><text x="55" y="95" fill="#20384b" font-family="Arial,sans-serif" font-size="20" font-weight="400"><tspan x="55" dy="0">Protocol-led evaluation, including negative findings.</tspan></text><rect x="45" y="145" width="215" height="155" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="63" y="175" fill="#31768a" font-family="Arial,sans-serif" font-size="17" font-weight="700"><tspan x="63" dy="0">01</tspan></text><text x="63" y="211" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="63" dy="0">Acquire</tspan></text><text x="63" y="247" fill="#20384b" font-family="Arial,sans-serif" font-size="16" font-weight="400"><tspan x="63" dy="0">Pinned upstream sources</tspan><tspan x="63" dy="23.2">Record provenance</tspan></text><path d="M262 220 L273 220" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><rect x="277" y="145" width="215" height="155" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="295" y="175" fill="#31768a" font-family="Arial,sans-serif" font-size="17" font-weight="700"><tspan x="295" dy="0">02</tspan></text><text x="295" y="211" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="295" dy="0">Construct</tspan></text><text x="295" y="247" fill="#20384b" font-family="Arial,sans-serif" font-size="16" font-weight="400"><tspan x="295" dy="0">Causal time windows</tspan><tspan x="295" dy="23.2">Preserve split boundaries</tspan></text><path d="M494 220 L505 220" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><rect x="509" y="145" width="215" height="155" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="527" y="175" fill="#31768a" font-family="Arial,sans-serif" font-size="17" font-weight="700"><tspan x="527" dy="0">03</tspan></text><text x="527" y="211" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="527" dy="0">Evaluate</tspan></text><text x="527" y="247" fill="#20384b" font-family="Arial,sans-serif" font-size="16" font-weight="400"><tspan x="527" dy="0">Baseline and foundation</tspan><tspan x="527" dy="23.2">model comparisons</tspan></text><path d="M726 220 L737 220" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><rect x="741" y="145" width="215" height="155" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="759" y="175" fill="#31768a" font-family="Arial,sans-serif" font-size="17" font-weight="700"><tspan x="759" dy="0">04</tspan></text><text x="759" y="211" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="759" dy="0">Control</tspan></text><text x="759" y="247" fill="#20384b" font-family="Arial,sans-serif" font-size="16" font-weight="400"><tspan x="759" dy="0">Matched populations</tspan><tspan x="759" dy="23.2">Registered ablations</tspan></text><path d="M958 220 L969 220" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><rect x="973" y="145" width="215" height="155" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="991" y="175" fill="#31768a" font-family="Arial,sans-serif" font-size="17" font-weight="700"><tspan x="991" dy="0">05</tspan></text><text x="991" y="211" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="991" dy="0">Decide</tspan></text><text x="991" y="247" fill="#20384b" font-family="Arial,sans-serif" font-size="16" font-weight="400"><tspan x="991" dy="0">Report uncertainty</tspan><tspan x="991" dy="23.2">Retain NO-GO outcomes</tspan></text><path d="M1190 220 L1201 220" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1205" y="145" width="215" height="155" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="1223" y="175" fill="#31768a" font-family="Arial,sans-serif" font-size="17" font-weight="700"><tspan x="1223" dy="0">06</tspan></text><text x="1223" y="211" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="1223" dy="0">Replay</tspan></text><text x="1223" y="247" fill="#20384b" font-family="Arial,sans-serif" font-size="16" font-weight="400"><tspan x="1223" dy="0">Freeze approved outputs</tspan><tspan x="1223" dy="23.2">Human-review workflow</tspan></text><text x="55" y="355" fill="#20384b" font-family="Arial,sans-serif" font-size="20" font-weight="400"><tspan x="55" dy="0">This is a workflow diagram, not a new experiment or a claim of real-machinery validity.</tspan></text></svg>
