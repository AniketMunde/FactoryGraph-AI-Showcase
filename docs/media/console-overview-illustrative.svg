<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 890" role="img" aria-labelledby="title desc"><title id="title">Illustrative Operations Console interface map</title><desc id="desc">Original data-free schematic, not a screenshot or model result. All labels describe capabilities only.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#31768a"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fa"/><rect x="20" y="20" width="1400" height="850" rx="14" fill="#ffffff" stroke="#cbd8e2"/><rect x="20" y="20" width="260" height="850" rx="14" fill="#102334" stroke="#102334"/><text x="45" y="65" fill="#ffffff" font-family="Arial,sans-serif" font-size="25" font-weight="700"><tspan x="45" dy="0">FactoryGraph AI</tspan></text><text x="45" y="101" fill="#e5b65c" font-family="Arial,sans-serif" font-size="13" font-weight="700"><tspan x="45" dy="0">OPERATIONS CONSOLE</tspan></text><text x="45" y="175" fill="#d9e4ed" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="45" dy="0">Fleet overview</tspan></text><text x="45" y="238" fill="#d9e4ed" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="45" dy="0">Assets</tspan></text><text x="45" y="301" fill="#d9e4ed" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="45" dy="0">Alert investigation</tspan></text><text x="45" y="364" fill="#d9e4ed" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="45" dy="0">Machine intelligence</tspan></text><text x="45" y="427" fill="#d9e4ed" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="45" dy="0">Graph evidence</tspan></text><text x="45" y="490" fill="#d9e4ed" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="45" dy="0">System / provenance</tspan></text><text x="45" y="553" fill="#d9e4ed" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="45" dy="0">Research information</tspan></text><text x="320" y="70" fill="#102334" font-family="Arial,sans-serif" font-size="34" font-weight="700"><tspan x="320" dy="0">Illustrative interface map</tspan></text><text x="320" y="110" fill="#31768a" font-family="Arial,sans-serif" font-size="15" font-weight="700"><tspan x="320" dy="0">INDEPENDENT DIAGRAM - NOT A SOFTWARE CAPTURE OR ACCEPTED CASE</tspan></text><text x="320" y="151" fill="#20384b" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="320" dy="0">The regions describe existing capabilities. No machine records, scores or telemetry are shown.</tspan></text><rect x="320" y="192" width="500" height="235" rx="14" fill="#f4f7fa" stroke="#cbd8e2"/><text x="342" y="234" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="342" dy="0">1  Fleet and assets</tspan></text><text x="342" y="282" fill="#20384b" font-family="Arial,sans-serif" font-size="19" font-weight="400"><tspan x="342" dy="0">Search authorized metadata</tspan><tspan x="342" dy="27.55">Explicitly request bounded replay</tspan><tspan x="342" dy="27.55">No rows or fleet values shown</tspan></text><rect x="855" y="192" width="520" height="235" rx="14" fill="#f4f7fa" stroke="#cbd8e2"/><text x="877" y="234" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="877" dy="0">2  Investigation</tspan></text><text x="877" y="282" fill="#20384b" font-family="Arial,sans-serif" font-size="19" font-weight="400"><tspan x="877" dy="0">Review score and policy provenance</tspan><tspan x="877" dy="27.55">Keep unavailable states visible</tspan><tspan x="877" dy="27.55">No prediction or alert is generated here</tspan></text><rect x="320" y="465" width="500" height="235" rx="14" fill="#f4f7fa" stroke="#cbd8e2"/><text x="342" y="507" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="342" dy="0">3  Sensors and history</tspan></text><text x="342" y="555" fill="#20384b" font-family="Arial,sans-serif" font-size="19" font-weight="400"><tspan x="342" dy="0">Four sensor channels; UTC cutoffs</tspan><tspan x="342" dy="27.55">Errors / maintenance / prior events</tspan><tspan x="342" dy="27.55">No measurements or event records shown</tspan></text><rect x="855" y="465" width="520" height="235" rx="14" fill="#f4f7fa" stroke="#cbd8e2"/><text x="877" y="507" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="877" dy="0">4  Evidence and human review</tspan></text><text x="877" y="555" fill="#20384b" font-family="Arial,sans-serif" font-size="19" font-weight="400"><tspan x="877" dy="0">Source-grounded graph and cutoff</tspan><tspan x="877" dy="27.55">Deterministic rules and report export</tspan><tspan x="877" dy="27.55">No source identities or case JSON shown</tspan></text><text x="320" y="765" fill="#102334" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="320" dy="0">Illustrative content is separate from verified research outcomes.</tspan></text><text x="320" y="805" fill="#20384b" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="320" dy="0">Actual sign-in capture is separately labeled. Data-bearing views need independent media clearance.</tspan></text></svg>
