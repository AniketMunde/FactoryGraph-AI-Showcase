<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 890" role="img" aria-labelledby="title desc"><title id="title">Offline research and historical replay</title><desc id="desc">Original architecture diagram. No source records or live inference are shown.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#31768a"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="55" y="68" fill="#102334" font-family="Arial,sans-serif" font-size="40" font-weight="700"><tspan x="55" dy="0">FactoryGraph AI</tspan></text><text x="55" y="109" fill="#20384b" font-family="Arial,sans-serif" font-size="21" font-weight="400"><tspan x="55" dy="0">Offline experiments and historical replay have different execution paths.</tspan></text><rect x="35" y="150" width="1370" height="315" rx="14" fill="#eaf2f6" stroke="#cbd8e2"/><text x="60" y="185" fill="#376475" font-family="Arial,sans-serif" font-size="18" font-weight="700"><tspan x="60" dy="0">OFFLINE RESEARCH</tspan></text><rect x="70" y="230" width="280" height="180" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="92" y="268" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="92" dy="0">Historical inputs</tspan></text><text x="92" y="307" fill="#20384b" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="92" dy="0">Causal feature windows</tspan><tspan x="92" dy="26.099999999999998">Purged chronological splits</tspan><tspan x="92" dy="26.099999999999998">Source tables and clocks</tspan></text><rect x="430" y="215" width="490" height="104" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="452" y="249" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Model experiments</tspan></text><text x="452" y="284" fill="#20384b" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="452" dy="0">LightGBM training | Kumo evaluation | Chronos forecasts</tspan></text><rect x="430" y="345" width="490" height="84" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="452" y="377" fill="#102334" font-family="Arial,sans-serif" font-size="19" font-weight="700"><tspan x="452" dy="0">Historical graph + independent source validation</tspan></text><text x="452" y="405" fill="#20384b" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="452" dy="0">Recorded facts; model peers are category associations</tspan></text><rect x="1030" y="225" width="330" height="210" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="1052" y="263" fill="#102334" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="1052" dy="0">Frozen replay inputs</tspan></text><text x="1052" y="305" fill="#20384b" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="1052" dy="0">Approved LightGBM + policy</tspan><tspan x="1052" dy="26.099999999999998">Saved Chronos context</tspan><tspan x="1052" dy="26.099999999999998">Graph and source evidence</tspan><tspan x="1052" dy="26.099999999999998">Kumo remains evaluation-only</tspan></text><path d="M350 290 L390 290 L390 266 L423 266" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 365 L390 365 L390 385 L423 385" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><path d="M920 266 L1021 266" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><path d="M920 386 L1021 386" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="505" width="1370" height="285" rx="14" fill="#eef5f2" stroke="#cbd8e2"/><text x="60" y="540" fill="#376475" font-family="Arial,sans-serif" font-size="18" font-weight="700"><tspan x="60" dy="0">ONLINE HISTORICAL REPLAY</tspan></text><rect x="70" y="590" width="270" height="150" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="90" y="626" fill="#102334" font-family="Arial,sans-serif" font-size="22" font-weight="700"><tspan x="90" dy="0">Operator clients</tspan></text><text x="90" y="666" fill="#20384b" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="90" dy="0">Next.js console</tspan><tspan x="90" dy="26.099999999999998">Streamlit dashboard</tspan></text><rect x="430" y="590" width="270" height="150" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="450" y="626" fill="#102334" font-family="Arial,sans-serif" font-size="22" font-weight="700"><tspan x="450" dy="0">Authenticated API</tspan></text><text x="450" y="666" fill="#20384b" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="450" dy="0">Role/resource checks</tspan><tspan x="450" dy="26.099999999999998">Bounded requests</tspan></text><rect x="790" y="590" width="270" height="150" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="810" y="626" fill="#102334" font-family="Arial,sans-serif" font-size="22" font-weight="700"><tspan x="810" dy="0">Case report engine</tspan></text><text x="810" y="666" fill="#20384b" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="810" dy="0">Historical cutoffs</tspan><tspan x="810" dy="26.099999999999998">Deterministic review rules</tspan></text><rect x="1150" y="590" width="220" height="150" rx="14" fill="#ffffff" stroke="#cbd8e2"/><text x="1170" y="626" fill="#102334" font-family="Arial,sans-serif" font-size="22" font-weight="700"><tspan x="1170" dy="0">Human review</tspan></text><text x="1170" y="666" fill="#20384b" font-family="Arial,sans-serif" font-size="18" font-weight="400"><tspan x="1170" dy="0">Evidence + provenance</tspan><tspan x="1170" dy="26.099999999999998">Traceable JSON</tspan></text><path d="M340 665 L421 665" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 665 L781 665" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1060 665 L1141 665" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1195 435 L1195 475 L925 475 L925 580" fill="none" stroke="#31768a" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="840" fill="#102334" font-family="Arial,sans-serif" font-size="21" font-weight="700"><tspan x="55" dy="0">Machine selection reuses saved outputs. It does not launch live Kumo/Chronos inference.</tspan></text></svg>
